name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Types
        run: npm run typecheck

      # Runs the schema and the publication gate over every career. This is the
      # step that stops an unsourced salary reaching production.
      - name: Content
        run: npm run validate:content

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
